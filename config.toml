# 林创 AI 客服的普通运行配置。
#
# 这里只保存可以进入源码管理的非敏感配置。网关令牌、数据库密码等秘密放在
# 项目根目录的 .env 中。修改本文件后需要重启 Python 服务才能生效。

[google_sheets]
# Google 表格中目标工作表的 gid。
# 它是浏览器地址末尾 `gid=` 后面的数字，不是表格文件 ID，也不是工作表名称。
gid = 0

# Python 在接收开启期间检查 Google 表格新增行的时间间隔，单位为秒。
# 例如设为 60，表示一轮完成后约 60 秒再检查下一轮。
poll_interval_seconds = 60

# 每次向 Apps Script 请求的最大数据行数。
# 网关允许 1～500；如果一次新增超过此数量，Python 后续会分批读取。
batch_size = 100

# 单次 Apps Script HTTP 请求的超时时间，单位为秒。
# 超时或网络失败时，本轮不推进内存行号，由下一轮重新读取。
request_timeout_seconds = 30

# Python 服务启动时是否自动开启 Google 表格接收。
# 默认 false：不请求网关，不启动接收轮询；不影响其他客户处理模块。
# 修改为 true 或 false 后，需要停止并重新启动 Python 服务才生效。
# 暂不提供 FastAPI 开关接口，也不自动监测本文件的修改。
# true 启动时先取得当时表格末行，跳过历史以及关闭期间新增的数据。
# 清库前先改为 false，等待旧服务正常停止，再重启并确认“接收已关闭”。
enabled_on_startup = false            # Python 服务启动时是否自动开启 Google 表格接收。

# MySQL 普通配置；密码只放在 .env。修改后重启生效。
# 数据库为 2026-09-12 新建的新系统专用库 lintratek_AI，与旧系统的 lintratek_chat 完全隔离。
[mysql]
host = "127.0.0.1"
port = 3306
user = "root"
database = "lintratek_AI"
# 建立连接超时秒数。
connection_timeout = 10

[wa_bridge]
# Python 调用本机 WhatsApp 桥；不会因配置本段而启动扫描或发送。
base_url = "http://127.0.0.1:3010"
# 请求超时不等于发送失败；发送超时需要人工检查，不自动重发。
request_timeout_seconds = 60

[first_contact]
# 自动首次联系开关，独立于 Google 表格同步。准备测试 lead 后再开启。
# 开启后会处理库中所有未联系线索；修改后需要重启 Python 服务。
enabled_on_startup = false
# 每一轮完成后等待的秒数。
poll_interval_seconds = 20
# 每轮最多处理的线索数量，单进程逐条发送。
batch_size = 20
